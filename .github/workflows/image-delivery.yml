name: Image Delivery

on:
  pull_request:
    branches:
      - master
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.github/actions/**'
      - '.github/workflows/**'
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  validate-pr:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Lint GitHub Actions
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Go formatting
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(find . -type f -name '*.go' -not -path './.git/*' -exec gofmt -l {} +)"
          if [[ -n "${unformatted}" ]]; then
            printf 'The following files require gofmt:\n%s\n' "${unformatted}"
            exit 1
          fi

      - name: Run Go tests
        run: go test ./...

      - name: Compile Go packages
        run: go build ./...

      - name: Build image without push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            COMMIT=${{ github.sha }}

  build-and-push:
    name: Publish Image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Determine image tag
        id: image-tag
        run: echo "tag=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (${{ steps.image-tag.outputs.tag }})
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:${{ steps.image-tag.outputs.tag }}
          build-args: |
            COMMIT=${{ github.sha }}
